name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only reads the repository
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # SQL Server for the integration tests. The password belongs to a throwaway
    # container that lives only for this run, so it is not a real secret.
    # (The `env` context is not available in `services`, hence the literal.)
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Only_Pa55word!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci_Only_Pa55word! -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        env:
          # Integration tests create their own database on this server
          SERVICEREQUESTS_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=Ci_Only_Pa55word!;TrustServerCertificate=True"
        run: dotnet test --no-build --configuration Release --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: ignore
